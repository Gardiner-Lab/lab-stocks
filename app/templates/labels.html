<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Labels · Lab Stocks</title>
    <link rel="stylesheet" href="{{ request.script_root }}/static/css/stocks.css?v={{ version }}">
</head>
<body class="labels-page">
<header class="topbar no-print">
    <a class="topbar-back" href="{{ request.script_root }}/">← Lab Stocks</a>
    <span class="topbar-title">🏷️ Labels</span>
    <span class="dymo-export" title="Files for DYMO Connect (the LabelWriter 550's software), on LabTAG labels">
        <label class="hint">Label <select id="dymoStock"></select></label>
        <select id="dymoRegion" title="DYMO Connect's region: its label stock names differ between them">
            <option value="EU">Europe</option>
            <option value="NA">North America</option>
        </select>
        <label class="hint" title="A QR code on each sticker that has room for one"><input type="checkbox" id="dymoQr" checked> QR</label>
        <button class="btn btn-primary" onclick="window.print()" title="Print these labels, one to a page of the label's size">🖨 Print</button>
        <button class="btn" id="btnDymo" title="A zip of .dymo files to open and print in DYMO Connect">⬇ DYMO files</button>
    </span>
</header>
<p class="hint no-print labels-help" id="labelsHelp"></p>
<p class="hint no-print labels-help dymo-hint" id="dymoHint"></p>
<div class="no-print labels-help" id="missing"></div>
<div class="dymo-sheet" id="sheet"></div>
<script>
    window.ST = { base: {{ request.script_root | tojson }}, public: {{ links.public | tojson }} };
</script>
<!-- qrcode-generator (MIT), kept in this repository. -->
<script src="{{ request.script_root }}/static/vendor/qrcode.js?v={{ version }}"></script>
<script src="{{ request.script_root }}/static/js/dymo.js?v={{ version }}"></script>
<script src="{{ request.script_root }}/static/js/labels.js?v={{ version }}"></script>
</body>
</html>
